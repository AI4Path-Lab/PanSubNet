[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pansubnet"
version = "0.1.0"
description = "Cell + patch cross-attention MIL for pancreatic cancer whole-slide image classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
    "scipy>=1.10",
    "tiffslide>=2.3",
]

[tool.setuptools]
packages = ["pansubnet"]

[tool.setuptools.package-data]
pansubnet = ["data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
